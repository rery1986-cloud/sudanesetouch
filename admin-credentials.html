<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بيانات مديرة النظام | لمسة</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #4a332a; background: #f7f3ed; }
    body { margin: 0; padding: 24px; }
    .card { max-width: 480px; margin: 24px auto; padding: 24px; background: white; border-radius: 16px; box-shadow: 0 10px 30px #4a332a22; }
    h1 { margin-top: 0; font-size: 22px; }
    p { line-height: 1.7; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #d8cbbd; border-radius: 10px; }
    input[type="email"] { direction: ltr; text-align: left; }
    button, .back-link { display: block; width: 100%; box-sizing: border-box; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px; background: #4a332a; color: white; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
    button.secondary { background: #c98e88; }
    button:disabled { opacity: .6; cursor: wait; }
    .hidden { display: none; }
    .message { min-height: 22px; margin-top: 12px; color: #8b554f; }
    .hint { color: #735447; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>بيانات مديرة النظام</h1>
    <p class="hint">تظهر بيانات الحساب القابلة للتعديل بعد التحقق من الحساب وصلاحية مديرة النظام. لا تشاركي كلمة المرور مع أي شخص.</p>

    <section id="loginSection">
      <label for="currentEmail">البريد الإلكتروني</label>
      <input id="currentEmail" type="email" autocomplete="username" readonly />
      <label for="currentPassword">كلمة المرور</label>
      <input id="currentPassword" type="password" autocomplete="current-password" required />
      <button id="loginBtn" type="button">التحقق وفتح بيانات المديرة</button>
      <button id="recoveryBtn" class="secondary" type="button">لا أستطيع الدخول؟ أرسلي رابط إعداد كلمة مرور جديدة</button>
    </section>

    <section id="updateSection" class="hidden">
      <label for="adminName">الاسم الظاهر</label>
      <input id="adminName" type="text" autocomplete="name" maxlength="100" />
      <label for="adminPhone">رقم التواصل</label>
      <input id="adminPhone" type="tel" autocomplete="tel" maxlength="30" />
      <label for="newPassword">كلمة المرور الجديدة (اختياري)</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" />
      <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" />
      <button id="updateBtn" type="button">حفظ البيانات</button>
      <button id="logoutBtn" class="secondary" type="button">تسجيل الخروج</button>
    </section>

    <a class="back-link" href="index.html">العودة إلى تسجيل الدخول</a>
    <div id="message" class="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const SUPABASE_URL = "https://gjoybqpjmiobsoskzlgf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mtkJj_XSu4GhwQWUII1YYw_w51HcU_R";
    const ADMIN_EMAIL = "rery1986@gmail.com";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    let verifiedAdmin = null;

    function setMessage(text, isError = false) {
      $("message").textContent = text;
      $("message").style.color = isError ? "#9f1239" : "#166534";
    }

    $("currentEmail").value = ADMIN_EMAIL;

    $("recoveryBtn").addEventListener("click", async () => {
      const button = $("recoveryBtn");
      button.disabled = true;
      setMessage("جاري طلب رابط آمن إلى البريد المسجل...");
      try {
        const redirectTo = new URL(".", window.location.href).toString();
        const { error } = await supabaseClient.auth.resetPasswordForEmail(ADMIN_EMAIL, { redirectTo });
        if (error) {
          console.error("Administrator password setup email failed:", error.message);
          setMessage(`تعذر إرسال رابط الإعداد: ${error.message}`, true);
          return;
        }
        setMessage("إذا كان الطلب مسموحاً، سيصل رابط آمن إلى البريد المسجل. افتحيه لإدخال اسمك وكلمة مرور جديدة وتأكيدها.");
      } catch (error) {
        console.error("Administrator password setup request failed:", error);
        setMessage("تعذر الاتصال بخدمة إرسال الرابط. حاولي مجدداً بعد قليل.", true);
      } finally {
        button.disabled = false;
      }
    });

    $("loginBtn").addEventListener("click", async () => {
      const button = $("loginBtn");
      const password = $("currentPassword").value;
      if (!password) {
        setMessage("أدخلي كلمة المرور للتحقق من الحساب.", true);
        return;
      }

      button.disabled = true;
      setMessage("جاري التحقق من الحساب والصلاحية...");
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email: ADMIN_EMAIL, password });
        if (error) {
          setMessage("تعذر التحقق من الدخول. تأكدي من كلمة المرور وتأكيد البريد الإلكتروني.", true);
          return;
        }
        if (data.user.email?.toLowerCase() !== ADMIN_EMAIL) {
          await supabaseClient.auth.signOut();
          setMessage("هذا الحساب ليس حساب مديرة النظام المعتمد.", true);
          return;
        }

        const { data: admin, error: adminError } = await supabaseClient
          .from("platform_admins")
          .select("user_id, email")
          .eq("user_id", data.user.id)
          .maybeSingle();
        if (adminError || !admin || admin.email?.toLowerCase() !== ADMIN_EMAIL) {
          await supabaseClient.auth.signOut();
          console.error("Super administrator verification failed:", adminError?.message || "No matching admin record");
          setMessage("تعذر إثبات صلاحية مديرة النظام لهذا الحساب.", true);
          return;
        }

        verifiedAdmin = data.user;
        $("adminName").value = data.user.user_metadata?.full_name || data.user.user_metadata?.name || "";
        $("adminPhone").value = data.user.user_metadata?.phone || "";
        $("loginSection").classList.add("hidden");
        $("updateSection").classList.remove("hidden");
        setMessage("تم التحقق. يمكنكِ تعديل الاسم ورقم التواصل أو تغيير كلمة المرور.");
      } catch (error) {
        console.error("Administrator settings sign-in failed:", error);
        setMessage("تعذر الاتصال بخدمة المصادقة. حاولي مجدداً.", true);
      } finally {
        button.disabled = false;
      }
    });

    $("updateBtn").addEventListener("click", async () => {
      if (!verifiedAdmin) {
        setMessage("انتهت جلسة التحقق. سجّلي الدخول مجدداً.", true);
        $("updateSection").classList.add("hidden");
        $("loginSection").classList.remove("hidden");
        return;
      }

      const name = $("adminName").value.trim();
      const phone = $("adminPhone").value.trim();
      const password = $("newPassword").value;
      const confirmation = $("confirmPassword").value;
      if (!name) {
        setMessage("الاسم الظاهر مطلوب.", true);
        return;
      }
      if (password && password.length < 8) {
        setMessage("كلمة المرور الجديدة يجب ألا تقل عن 8 أحرف.", true);
        return;
      }
      if (password !== confirmation) {
        setMessage("كلمتا المرور غير متطابقتين.", true);
        return;
      }

      const button = $("updateBtn");
      button.disabled = true;
      setMessage("جاري حفظ البيانات...");
      try {
        const attributes = {
          data: { ...verifiedAdmin.user_metadata, full_name: name, phone }
        };
        if (password) attributes.password = password;

        const { data, error } = await supabaseClient.auth.updateUser(attributes);
        if (error) {
          setMessage(`تعذر حفظ البيانات: ${error.message}`, true);
          return;
        }

        verifiedAdmin = data.user;
        $("newPassword").value = "";
        $("confirmPassword").value = "";
        setMessage(password
          ? "تم حفظ البيانات وتحديث كلمة المرور."
          : "تم حفظ الاسم ورقم التواصل.");
      } catch (error) {
        console.error("Administrator settings update failed:", error);
        setMessage("تعذر الاتصال بخدمة المصادقة. لم يتم تأكيد حفظ التغييرات.", true);
      } finally {
        button.disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        console.error("Administrator settings sign-out failed:", error.message);
        setMessage("تعذر تسجيل الخروج. أغلقي الصفحة عند الانتهاء.", true);
        return;
      }
      verifiedAdmin = null;
      $("updateSection").classList.add("hidden");
      $("loginSection").classList.remove("hidden");
      $("currentPassword").value = "";
      setMessage("تم تسجيل الخروج.");
    });
  </script>
</body>
</html>
