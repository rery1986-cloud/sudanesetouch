<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تغيير بيانات مديرة النظام</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f3ed; color: #4a332a; margin: 0; }
    .card { max-width: 480px; margin: 40px auto; padding: 24px; background: white; border-radius: 16px; box-shadow: 0 10px 30px #4a332a22; }
    h1 { margin-top: 0; font-size: 22px; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #d8cbbd; border-radius: 10px; direction: ltr; }
    button { width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px; background: #4a332a; color: white; font-weight: bold; cursor: pointer; }
    button.secondary { background: #c98e88; }
    .hidden { display: none; }
    .message { min-height: 22px; margin-top: 12px; color: #8b554f; }
  </style>
</head>
<body>
  <main class="card">
    <h1>بيانات مديرة النظام</h1>

    <section id="configSection">
      <label for="projectUrl">Supabase Project URL</label>
      <input id="projectUrl" type="url" placeholder="https://xxxx.supabase.co" />
      <label for="anonKey">Supabase anon key</label>
      <input id="anonKey" type="password" />
      <button id="saveConfig" type="button">حفظ إعدادات الاتصال</button>
    </section>

    <section id="loginSection" class="hidden">
      <label for="currentEmail">البريد الحالي</label>
      <input id="currentEmail" type="email" autocomplete="username" />
      <label for="currentPassword">كلمة المرور الحالية</label>
      <input id="currentPassword" type="password" autocomplete="current-password" />
      <button id="loginBtn" type="button">تسجيل الدخول للتحقق</button>
    </section>

    <section id="updateSection" class="hidden">
      <label for="newEmail">البريد الجديد</label>
      <input id="newEmail" type="email" autocomplete="email" />
      <label for="newPassword">كلمة المرور الجديدة</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" />
      <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" />
      <button id="updateBtn" type="button">حفظ بيانات المدير</button>
      <button id="logoutBtn" class="secondary" type="button">تسجيل الخروج</button>
    </section>

    <div id="message" class="message"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let supabaseClient = null;

    function setMessage(text) {
      $('message').textContent = text;
    }

    function initClient() {
      const url = $('projectUrl').value.trim();
      const key = $('anonKey').value.trim();
      if (!url || !key) {
        setMessage('أدخلي عنوان المشروع والمفتاح العام أولاً.');
        return false;
      }

      localStorage.setItem('sudanesetouch_supabase_url', url);
      localStorage.setItem('sudanesetouch_supabase_key', key);
      supabaseClient = window.supabase.createClient(url, key);
      $('configSection').classList.add('hidden');
      $('loginSection').classList.remove('hidden');
      setMessage('');
      return true;
    }

    $('projectUrl').value = localStorage.getItem('sudanesetouch_supabase_url') || '';
    $('anonKey').value = localStorage.getItem('sudanesetouch_supabase_key') || '';

    $('saveConfig').addEventListener('click', initClient);

    $('loginBtn').addEventListener('click', async () => {
      if (!supabaseClient && !initClient()) return;

      const email = $('currentEmail').value.trim();
      const password = $('currentPassword').value;
      setMessage('جاري التحقق...');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        setMessage(error.message);
        return;
      }

      const { data: admin, error: adminError } = await supabaseClient
        .from('platform_admins')
        .select('email')
        .eq('user_id', data.user.id)
        .maybeSingle();

      if (adminError || !admin) {
        await supabaseClient.auth.signOut();
        setMessage('هذا الحساب غير مصرح له كمديرة للنظام.');
        return;
      }

      $('loginSection').classList.add('hidden');
      $('updateSection').classList.remove('hidden');
      $('newEmail').value = admin.email;
      setMessage('تم التحقق. أدخلي القيم الجديدة.');
    });

    $('updateBtn').addEventListener('click', async () => {
      const email = $('newEmail').value.trim();
      const password = $('newPassword').value;
      const confirmation = $('confirmPassword').value;

      if (!email) {
        setMessage('البريد الجديد مطلوب.');
        return;
      }
      if (password && password.length < 8) {
        setMessage('كلمة المرور يجب ألا تقل عن 8 أحرف.');
        return;
      }
      if (password !== confirmation) {
        setMessage('كلمتا المرور غير متطابقتين.');
        return;
      }

      setMessage('جاري حفظ البيانات...');
      const updates = { email };
      if (password) updates.password = password;

      const { error } = await supabaseClient.auth.updateUser(updates);
      if (error) {
        setMessage(error.message);
        return;
      }

      setMessage(password
        ? 'تم حفظ كلمة المرور الجديدة. إذا تم تفعيل تأكيد البريد سيطلب تأكيد البريد الجديد عند تسجيل الدخول التالي.'
        : 'تم إرسال طلب تغيير البريد. تأكدي من البريد الجديد قبل الدخول به.');
      $('newPassword').value = '';
      $('confirmPassword').value = '';
    });

    $('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      $('updateSection').classList.add('hidden');
      $('loginSection').classList.remove('hidden');
      $('currentPassword').value = '';
      setMessage('تم تسجيل الخروج.');
    });

    if ($('projectUrl').value && $('anonKey').value) {
      initClient();
    }
  </script>
</body>
</html>
